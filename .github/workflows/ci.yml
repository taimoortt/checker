name: artifact-ci

on:
  push:
  pull_request:

jobs:
  docker-build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reference image
        run: docker build -t radioninja-artifact .
      - name: Validate manifests and commands
        run: docker run --rm radioninja-artifact run --scenario all --seeds 0 --duration 1 --dry-run
